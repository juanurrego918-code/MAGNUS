<!doctype html><html lang="es"><meta charset="utf-8"><title>Magnus – Sistema (vertical)</title>
<style>
:root{--r:#D91E26;--rl:#FF5A5F;--rd:#A3141A;--k:#17151A;--bg:#F4F2F3;--g:#5b575d;--line:#E6E2E4;--ok:#1E8E4E;--okb:#E3F4EA;--am:#9A6410;--amb:#FFF1D2;--rb:#FDE4E5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--k);font-variant-numeric:tabular-nums}
#root{position:relative;width:1080px;height:1920px;overflow:hidden}
.sc{position:absolute;inset:0;opacity:0;visibility:hidden}
.abs{position:absolute}
.stripe{position:absolute;width:260px;height:2800px;background:var(--r);transform:rotate(35deg);opacity:.045}
.hd{position:absolute;left:60px;top:110px;width:960px}
.hd .k{color:var(--r);font-weight:800;letter-spacing:5px;font-size:28px;text-transform:uppercase}
.hd h2{font-size:92px;font-weight:900;letter-spacing:-4px;line-height:1;margin-top:14px}
.hd h2 em{font-style:normal;color:var(--r)}
.ui{position:absolute;left:60px;top:640px;width:960px;height:1240px}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px 30px;box-shadow:0 14px 40px rgba(23,21,26,.07)}
.lbl{font-size:24px;color:var(--g);font-weight:600}
.num{font-size:64px;font-weight:900;letter-spacing:-2px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 20px;font-weight:800;font-size:24px;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.am{background:var(--amb);color:var(--am)}.rd{background:var(--rb);color:var(--rd)}.gr{background:#ECEAEB;color:#6c686e}
.red{color:var(--r)}.big{font-weight:900;letter-spacing:-3px;line-height:1.02}
.ph{background:repeating-linear-gradient(45deg,#ECEAEB,#ECEAEB 8px,#F4F2F3 8px,#F4F2F3 16px);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#8a868c;font-weight:700;text-align:center}
.hl{outline:5px solid var(--r);outline-offset:6px;border-radius:12px}
.phone{position:absolute;width:440px;height:900px;background:#17151A;border-radius:64px;padding:16px;box-shadow:0 40px 90px rgba(23,21,26,.3);transform-origin:top left}
.phone .scr{width:100%;height:100%;background:#fff;border-radius:50px;overflow:hidden;position:relative}
.nt{position:absolute;left:50%;top:14px;width:130px;height:34px;margin-left:-65px;background:#17151A;border-radius:20px;z-index:5}
.row{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.nm{font-weight:800;font-size:23px}.sb{font-size:18px;color:var(--g);margin-top:3px}
.add{margin-left:auto;width:56px;height:56px;border-radius:16px;background:var(--r);color:#fff;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
#step{position:absolute;left:60px;top:420px;width:960px;height:150px;display:flex;align-items:center;gap:26px}
#step .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--r);color:#fff;font-weight:900;font-size:50px;display:flex;align-items:center;justify-content:center}
#step .t{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
#prog{position:absolute;left:60px;top:56px;width:960px;display:flex;gap:8px}
#prog i{flex:1;height:8px;border-radius:4px;background:#E0DCDE;overflow:hidden}#prog b{display:block;height:100%;background:var(--r);width:0}
.foot{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:22px;color:#8a868c}
</style>
<div id="root">
<div class="stripe" id="s1" style="left:-100px;top:-500px"></div><div class="stripe" id="s2" style="left:760px;top:-900px"></div>
<div id="prog"></div>
<div id="step"><div class="n" id="stn">1</div><div class="t" id="stt"></div></div>

window.render=function(t){

 });

};
